name: Manual Cloudflare deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA of the selected branch or tag
        required: true
        type: string
      confirm_deployment:
        description: Publish this validated commit to the configured Cloudflare Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ inputs.confirm_deployment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the selected source commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run test:fixed-mushaf
      - run: npm run test:mobile-calibration
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare deployment credentials are not configured."; exit 1; }
          npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
