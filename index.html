<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahqeeq — recitation judging</title>
    <meta name="description" content="Pinpoint judging for Quran recitation competitions" />
    <meta id="theme-color-meta" name="theme-color" content="#f2f1ee" />
    <meta name="application-name" content="Tahqeeq" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tahqeeq" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/tahqeeq-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/tahqeeq-apple-touch-180.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tahqeeq.theme");
          if (t !== "light" && t !== "dark") {
            t = "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var themeColor = document.getElementById("theme-color-meta");
          if (themeColor) {
            themeColor.setAttribute("content", t === "dark" ? "#131316" : "#f2f1ee");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/hafs.18.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
