<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahqeeq — recitation judging</title>
    <meta name="description" content="Pinpoint judging for Quran recitation competitions" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tahqeeq.theme");
          if (t !== "light" && t !== "dark") {
            t = "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/hafs.18.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
